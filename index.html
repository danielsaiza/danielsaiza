
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniel Saiza</title>

<link rel="icon" href="./favicon.svg" type="image/svg+xml">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #ffffff;
  color: #111111;
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
}

#login {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

.container {
  width: 100%;
}

.title {
  font-size: 11px;
  font-weight: 400;
  margin-bottom: 22px;
}

.subtitle {
  font-size: 10px;
  color: #777777;
  margin-bottom: 14px;
}

input {
  border: none;
  border-bottom: 1px solid #dddddd;
  background: transparent;
  outline: none;
  text-align: center;
  font-size: 11px;
  padding: 8px;
  width: 180px;
  color: #111111;
  border-radius: 0;
}

input:focus {
  border-bottom-color: #111111;
}

input::placeholder {
  color: #aaaaaa;
}

.error {
  font-size: 10px;
  color: #888888;
  margin-top: 15px;
  display: none;
}

#home {
  display: none;
  min-height: 100vh;
  background: #ffffff;
}
</style>
</head>

<body>

<div id="login">
  <div class="container">
    <div class="title">Access Denied</div>
    <div class="subtitle">Enter password</div>

    <input
      type="password"
      id="password"
      placeholder="••••••"
      autocomplete="off"
    >

    <div class="error" id="error">
      Incorrect password
    </div>
  </div>
</div>

<div id="home">
  <!-- YOUR WEBSITE STARTS HERE -->
</div>

<script>
const passwordInput = document.getElementById("password");
const errorMessage = document.getElementById("error");

passwordInput.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    if (passwordInput.value === "tttth") {
      document.getElementById("login").style.display = "none";
      document.getElementById("home").style.display = "block";
      document.title = "Daniel Saiza";
    } else {
      errorMessage.style.display = "block";
      passwordInput.value = "";
    }
  }
});
</script>

</body>
</html>
